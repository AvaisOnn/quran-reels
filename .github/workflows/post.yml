name: Post Quran Reel

# Fires 4x/day (UTC), evenly every 6 hours. Adjust times to your audience's timezone.
on:
  # Times are UTC. Pakistan = UTC+5, so these fire every 6h: 12 AM / 6 AM / 12 PM / 6 PM PKT.
  schedule:
    - cron: "0 19 * * *"   # 00:00 PKT (midnight)
    - cron: "0 1 * * *"    # 06:00 PKT (morning)
    - cron: "0 7 * * *"    # 12:00 PKT (midday)
    - cron: "0 13 * * *"   # 18:00 PKT (evening)
  workflow_dispatch: {}     # manual "Run workflow" button for testing

permissions:
  contents: write           # to commit progress.json + create releases

concurrency:
  group: post-reel          # never run two posts at once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # never let a hung step block the queue for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install ffmpeg
        timeout-minutes: 8      # apt mirrors occasionally stall forever
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT update && sudo apt-get $APT install -y ffmpeg fonts-noto

      - name: Install deps
        run: pip install pillow arabic-reshaper python-bidi requests

      - name: Generate next reel (curated viral verses)
        run: python make_viral.py

      - name: Upload reel as public release asset
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(python -c "import json;print(json.load(open('progress.json'))['next_viral'])")
          TAG="reel-verse-${N}-$(date +%s)"
          gh release create "$TAG" output/reel.mp4 --title "$TAG" --notes "auto"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/reel.mp4" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_to_instagram.py "${{ steps.upload.outputs.url }}" output/reel.txt

      - name: Publish to Facebook Page
        continue-on-error: true   # FB is a bonus; never block IG/bookmark on it
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          # Reuse the same long-lived token as IG; the script derives a Page
          # token from it. Set FB_PAGE_TOKEN secret to override.
          FB_USER_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python post_to_facebook.py "${{ steps.upload.outputs.url }}" output/reel.txt

      - name: Commit advanced bookmark
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add progress.json
          git commit -m "advance to viral verse $(python -c "import json;print(json.load(open('progress.json'))['next_viral'])")" || echo "nothing to commit"
          git pull --rebase origin main
          git push
